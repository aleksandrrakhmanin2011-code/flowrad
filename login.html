<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FLOWRAD — Вход</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 360px;
            max-width: calc(100% - 40px);
            padding: 30px;
            background: #080808;
            border: 1px solid #222;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
        }

        .title {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 14px;

            background: #111;
            color: #fff;

            border: 1px solid #292929;
            border-radius: 7px;

            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #555;
        }

        button {
            width: 100%;
            height: 46px;
            margin-top: 12px;

            border: 0;
            border-radius: 7px;

            background: #fff;
            color: #000;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #ddd;
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .error {
            min-height: 18px;
            margin-top: 12px;

            text-align: center;
            color: #ff5555;
            font-size: 13px;
        }

        .loading {
            display: none;
            margin-top: 12px;

            text-align: center;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="title">FLOWRAD</div>

    <div class="subtitle">
        Авторизация
    </div>

    <form id="loginForm">

        <input
            id="password"
            type="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
            required
        >

        <button id="loginButton" type="submit">
            ВОЙТИ
        </button>

        <div id="error" class="error"></div>

        <div id="loading" class="loading">
            Проверка...
        </div>

    </form>

</div>

<script>
const form = document.getElementById("loginForm");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const errorElement = document.getElementById("error");
const loadingElement = document.getElementById("loading");

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    errorElement.textContent = "";

    const password = passwordInput.value.trim();

    if (!password) {
        errorElement.textContent = "Введите пароль";
        return;
    }

    loginButton.disabled = true;
    loadingElement.style.display = "block";

    try {

        const response = await fetch("/login", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                password: password
            }),

            credentials: "include"
        });

        if (response.ok) {

            window.location.replace("/");

            return;
        }

        if (response.status === 401) {
            errorElement.textContent = "Неверный пароль";
        } else {
            errorElement.textContent = "Ошибка авторизации";
        }

    } catch (error) {

        errorElement.textContent = "Не удалось подключиться к серверу";

    } finally {

        loginButton.disabled = false;
        loadingElement.style.display = "none";

    }

});
</script>

</body>
</html>
